<!doctype html>
<html lang="en">
    {% include head.html %}
    <body>
        <a class="skip-link" href="#main-content">Skip to content</a>
        <div id="container">
            {% include banner.html %}
            <main id="main-content" class="main">
                <h1 class="title">{{ page.title }}</h1>
                <p class="date">{{ page.date | date: '%B %d, %Y' }}</p>
                {% if page.keywords %}<p class="keywords">{{ page.keywords }}</p>{% endif %}
                <div class="blog-text">
                    {{ content }}
                </div>
            </main>
            {% include footer.html %}
        </div>
    </body>
</html>
