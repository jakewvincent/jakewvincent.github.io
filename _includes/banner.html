{% assign masthead_image = page.main-img-wide | default: page.main-img | default: site.default_image_wide | default: site.default_image %}
{% assign masthead_alt = page.main-img-alt | default: page.main-img-title | default: site.default_image_alt %}
<header id="banner" class="site-masthead">
    <a id="name" class="site-name" href="/" aria-label="Jake W. Vincent — home">Jake W. Vincent</a>
    <div class="masthead-photo" style="--masthead-position: {{ page.main-img-position | default: 'center center' }}">
        <img src="{{ masthead_image | relative_url }}" alt="{{ masthead_alt | escape }}" decoding="async" loading="eager" fetchpriority="high">
    </div>
    {% include navigation.html %}
</header>
